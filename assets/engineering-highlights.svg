<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="176" viewBox="0 0 1120 176" role="img" aria-labelledby="title description">
  <title id="title">Engineering experience and contributions</title>
  <desc id="description">7.5 years in web development. 4.5 years in Windchill development. Implemented 12 MCP tools across two domains. Contributed to two of the three Change AI Extension agents.</desc>
  <defs>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#0D1424"/>
      <stop offset="1" stop-color="#18172C"/>
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#67E8F9" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity=".1"/>
    </linearGradient>
    <clipPath id="counter-window" clipPathUnits="userSpaceOnUse">
      <rect x="18" y="43" width="90" height="68"/>
    </clipPath>
    <g id="digit-strip" class="counter-digit">
      <text y="54">0</text>
      <text y="118">1</text>
      <text y="182">2</text>
      <text y="246">3</text>
      <text y="310">4</text>
      <text y="374">5</text>
      <text y="438">6</text>
      <text y="502">7</text>
      <text y="566">8</text>
      <text y="630">9</text>
    </g>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; letter-spacing: 1px; fill: #B5BDCF; }
      .counter-digit { font-size: 54px; font-weight: 750; font-variant-numeric: tabular-nums; }
      .counter-final { opacity: 0; }
      .counter-roll { animation: counter-roll 2.4s cubic-bezier(.16, 1, .3, 1) forwards; }
      .counter-tens { animation-delay: .48s; animation-duration: .13s; }
      .accent { animation: illuminate 8s ease-in-out infinite; }
      .second { animation-delay: -2s; }
      .third { animation-delay: -4s; }
      .fourth { animation-delay: -6s; }
      @keyframes counter-roll { from { transform: translateY(0); } to { transform: translateY(var(--counter-offset)); } }
      @keyframes illuminate { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .accent { animation: none; }
        .counter-final { opacity: 1; }
        .counter-window { display: none; }
      }
    </style>
  </defs>
  <g>
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">WEB DEVELOPMENT</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#F8FAFC"><tspan class="counter-final">7.5</tspan><tspan font-size="20" font-weight="400" fill="#B5BDCF">+ years</tspan></text>
    <g class="counter-window" aria-hidden="true" clip-path="url(#counter-window)" fill="#F8FAFC">
      <g transform="translate(22 47)">
        <g style="--counter-offset: -448px" class="counter-roll">
          <use href="#digit-strip"/>
        </g>
        <text x="28" y="54" font-size="54" font-weight="750" fill="#F8FAFC">.</text>
        <g transform="translate(43 0)">
          <g style="--counter-offset: -4800px" class="counter-roll">
            <use href="#digit-strip"/>
            <use href="#digit-strip" y="640"/>
            <use href="#digit-strip" y="1280"/>
            <use href="#digit-strip" y="1920"/>
            <use href="#digit-strip" y="2560"/>
            <use href="#digit-strip" y="3200"/>
            <use href="#digit-strip" y="3840"/>
            <use href="#digit-strip" y="4480"/>
          </g>
        </g>
      </g>
    </g>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Java + Angular</text>
  </g>
  <g transform="translate(284 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent second" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">WINDCHILL DEVELOPMENT</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#F8FAFC"><tspan class="counter-final">4.5</tspan><tspan font-size="20" font-weight="400" fill="#B5BDCF">+ years</tspan></text>
    <g class="counter-window" aria-hidden="true" clip-path="url(#counter-window)" fill="#F8FAFC">
      <g transform="translate(22 47)">
        <g style="--counter-offset: -256px" class="counter-roll">
          <use href="#digit-strip"/>
        </g>
        <text x="28" y="54" font-size="54" font-weight="750" fill="#F8FAFC">.</text>
        <g transform="translate(43 0)">
          <g style="--counter-offset: -2880px" class="counter-roll">
            <use href="#digit-strip"/>
            <use href="#digit-strip" y="640"/>
            <use href="#digit-strip" y="1280"/>
            <use href="#digit-strip" y="1920"/>
            <use href="#digit-strip" y="2560"/>
          </g>
        </g>
      </g>
    </g>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Enterprise PLM</text>
  </g>
  <g transform="translate(568 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent third" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">MCP TOOLS IMPLEMENTED</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#67E8F9"><tspan class="counter-final">12</tspan></text>
    <g class="counter-window" aria-hidden="true" clip-path="url(#counter-window)" fill="#67E8F9">
      <g transform="translate(22 47)">
        <g style="--counter-offset: -64px" class="counter-roll counter-tens">
          <use href="#digit-strip"/>
        </g>
        <g transform="translate(30 0)">
          <g style="--counter-offset: -768px" class="counter-roll">
            <use href="#digit-strip"/>
            <use href="#digit-strip" y="640"/>
          </g>
        </g>
      </g>
    </g>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Across two domains</text>
  </g>
  <g transform="translate(852 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent fourth" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">AI AGENT CONTRIBUTIONS</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#C4B5FD"><tspan class="counter-final">2</tspan><tspan font-size="28" font-weight="400" fill="#B5BDCF"> / 3</tspan></text>
    <g class="counter-window" aria-hidden="true" clip-path="url(#counter-window)" fill="#C4B5FD">
      <g transform="translate(22 47)">
        <g style="--counter-offset: -128px" class="counter-roll">
          <use href="#digit-strip"/>
        </g>
      </g>
    </g>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Change AI Extension</text>
  </g>
</svg>
