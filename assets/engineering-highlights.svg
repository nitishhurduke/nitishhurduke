<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="176" viewBox="0 0 1120 176" role="img" aria-labelledby="title description">
  <title id="title">Engineering experience and contributions</title>
  <desc id="description">7.5 years in web development. 4.5 years in Windchill development. Implemented 12 MCP tools across two domains. Contributed to two of the three Change AI Extension agents.</desc>
  <defs>
    <linearGradient id="card" x2="1" y2="1">
      <stop stop-color="#0D1424"/>
      <stop offset="1" stop-color="#18172C"/>
    </linearGradient>
    <linearGradient id="line">
      <stop stop-color="#67E8F9" stop-opacity=".1"/>
      <stop offset=".5" stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity=".1"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .label { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 13px; letter-spacing: 1px; fill: #B5BDCF; }
      .accent { animation: illuminate 8s ease-in-out infinite; }
      .second { animation-delay: -2s; }
      .third { animation-delay: -4s; }
      .fourth { animation-delay: -6s; }
      @keyframes illuminate { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .accent { animation: none; } }
    </style>
  </defs>
  <g>
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">WEB DEVELOPMENT</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#F8FAFC">7.5<tspan font-size="20" font-weight="400" fill="#B5BDCF"> years</tspan></text>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Java + Angular</text>
  </g>
  <g transform="translate(284 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent second" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">WINDCHILL DEVELOPMENT</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#F8FAFC">4.5<tspan font-size="20" font-weight="400" fill="#B5BDCF"> years</tspan></text>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Enterprise PLM</text>
  </g>
  <g transform="translate(568 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent third" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">MCP TOOLS IMPLEMENTED</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#67E8F9">12</text>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Across two domains</text>
  </g>
  <g transform="translate(852 0)">
    <rect x="1" y="1" width="267" height="174" rx="16" fill="url(#card)" stroke="#30344F"/>
    <path class="accent fourth" d="M24 2H244" stroke="url(#line)" stroke-width="2"/>
    <text x="24" y="35" class="label">AI AGENT CONTRIBUTIONS</text>
    <text x="22" y="101" font-size="54" font-weight="750" fill="#C4B5FD">2<tspan font-size="28" font-weight="400" fill="#B5BDCF"> / 3</tspan></text>
    <text x="24" y="142" font-size="16" fill="#B5BDCF">Change AI Extension</text>
  </g>
</svg>
