<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="480" viewBox="0 0 1120 480" role="img" aria-labelledby="title description">
  <title id="title">Nitish Hurduke - Strong backends. Thoughtful interfaces.</title>
  <desc id="description">7.5 years in web application development. An animated engineering diagram connects Angular interfaces, Spring Boot services, and PostgreSQL data. Building agentic applications.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#080D1A"/>
      <stop offset="1" stop-color="#14152D"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#67E8F9"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop stop-color="#6D28D9" stop-opacity=".24"/>
      <stop offset="1" stop-color="#6D28D9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A5B4FC" stroke-opacity=".055"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .packet { stroke-dasharray: 9 115; animation: travel 7s linear infinite; }
      .halo { animation: breathe 9s ease-in-out infinite alternate; }
      .edge { stroke-dasharray: 90 910; animation: orbit 16s linear infinite; }
      .signal { animation: signal 6s ease-in-out infinite; }
      @keyframes travel { to { stroke-dashoffset: -248; } }
      @keyframes breathe { from { opacity: .5; } to { opacity: 1; } }
      @keyframes orbit { to { stroke-dashoffset: -1000; } }
      @keyframes signal { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
      @media (prefers-reduced-motion: reduce) {
        .packet, .halo, .edge, .signal { animation: none; }
      }
    </style>
  </defs>

  <rect x="1" y="1" width="1118" height="478" rx="24" fill="url(#background)" stroke="#30344F"/>
  <rect x="2" y="2" width="1116" height="476" rx="23" fill="url(#grid)"/>
  <ellipse class="halo" cx="900" cy="210" rx="220" ry="210" fill="url(#halo)"/>
  <rect class="edge" x="2" y="2" width="1116" height="476" rx="23" pathLength="1000" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".8"/>
  <path d="M48 1H1072" stroke="url(#accent)" stroke-opacity=".6"/>

  <g transform="translate(48 52)">
    <path d="M11 0L1 10L11 20M29 0L39 10L29 20M23 -3L17 23" fill="none" stroke="#67E8F9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="56" y="17" font-size="21" font-weight="650" fill="#F1F5F9">Nitish Hurduke</text>
    <text class="mono" x="0" y="73" font-size="12" letter-spacing="2.3" fill="#B5BDCF">WEB APPLICATION DEVELOPER</text>
    <text x="-3" y="151" font-size="64" font-weight="750" letter-spacing="-2.5" fill="#F8FAFC">Strong backends.</text>
    <text x="-3" y="224" font-size="60" font-weight="750" letter-spacing="-2.5" fill="url(#accent)">Thoughtful interfaces.</text>
    <text x="0" y="268" font-size="18" fill="#B5BDCF">From the data model to the detail users notice.</text>
    <rect x="0" y="299" width="312" height="35" rx="17.5" fill="#122636" stroke="#24505E"/>
    <circle cx="18" cy="316.5" r="3.5" fill="#67E8F9"/>
    <text class="mono" x="32" y="321" font-size="12" fill="#B9EFF5">BUILDING / AGENTIC APPLICATIONS</text>
  </g>

  <g transform="translate(792 81)">
    <text class="mono" x="0" y="0" font-size="11" letter-spacing="2" fill="#AEB8CD">THINK IN SYSTEMS. BUILD IN DETAIL.</text>
    <path d="M128 94V130M128 204V240" fill="none" stroke="#485273" stroke-width="2"/>
    <path class="packet" d="M128 94V130M128 204V240" fill="none" stroke="#67E8F9" stroke-width="3"/>

    <rect x="0" y="20" width="256" height="74" rx="12" fill="#101D2D" stroke="#365165"/>
    <rect x="0" y="20" width="3" height="74" rx="1.5" fill="#67E8F9"/>
    <text class="mono" x="20" y="44" font-size="10" letter-spacing="1.5" fill="#A7BBCD">01 / INTERFACE</text>
    <text x="20" y="73" font-size="23" font-weight="600" fill="#E2F8FC">Angular</text>
    <path d="M211 50L203 57L211 64M225 50L233 57L225 64" fill="none" stroke="#67E8F9" stroke-width="2"/>

    <rect x="0" y="130" width="256" height="74" rx="12" fill="#171C32" stroke="#4B4C78"/>
    <rect x="0" y="130" width="3" height="74" rx="1.5" fill="#A5B4FC"/>
    <text class="mono" x="20" y="154" font-size="10" letter-spacing="1.5" fill="#B4BCD9">02 / SERVICES</text>
    <text x="20" y="183" font-size="23" font-weight="600" fill="#EDF0FF">Spring Boot</text>
    <path d="M204 159H232M204 167H232M204 175H232" stroke="#A5B4FC" stroke-width="2"/>
    <circle cx="208" cy="159" r="2" fill="#A5B4FC"/>

    <rect x="0" y="240" width="256" height="74" rx="12" fill="#211A35" stroke="#5C477B"/>
    <rect x="0" y="240" width="3" height="74" rx="1.5" fill="#C4B5FD"/>
    <text class="mono" x="20" y="264" font-size="10" letter-spacing="1.5" fill="#C6B9DD">03 / DATA</text>
    <text x="20" y="293" font-size="23" font-weight="600" fill="#F2EBFF">PostgreSQL</text>
    <g fill="none" stroke="#C4B5FD" stroke-width="1.7">
      <ellipse cx="218" cy="267" rx="12" ry="4"/>
      <path d="M206 267V284C206 290 230 290 230 284V267M206 276C206 282 230 282 230 276"/>
    </g>
  </g>

  <path d="M48 418H1072" stroke="#30344F"/>
  <text class="mono" x="48" y="452" font-size="12" letter-spacing="1" fill="#D1D8E8">7.5 YEARS / WEB DEVELOPMENT</text>
  <text class="mono" x="454" y="452" font-size="12" letter-spacing="1" fill="#D1D8E8">JAVA + ANGULAR</text>
  <text class="mono" x="792" y="452" font-size="12" letter-spacing="1" fill="#D1D8E8">OPEN TO COLLABORATION</text>
  <circle class="signal" cx="1059" cy="448" r="7" fill="#67E8F9" opacity=".6" filter="url(#glow)"/>
  <circle cx="1059" cy="448" r="2.5" fill="#A5F3FC"/>
</svg>
