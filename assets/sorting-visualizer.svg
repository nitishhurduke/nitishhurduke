<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title description">
  <title id="title">Sorting visualizer: one comparison, one swap</title>
  <desc id="description">Illustrative looping animation, not an interactive demo or benchmark. One bubble-sort step compares adjacent values 8 and 3 in [2, 8, 3, 6], then swaps them to form [2, 3, 8, 6]. This is not a complete sort. The Angular app supports six algorithms, adjustable size and speed, input distributions, and operation counters. With reduced motion, the starting array stays visible.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#19152D"/></linearGradient>
    <linearGradient id="cyan" x2="0" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#155E75"/></linearGradient>
    <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#C4B5FD"/><stop offset="1" stop-color="#5B21B6"/></linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
      .eight { animation: swap-right 10s ease-in-out infinite; }
      .three { animation: swap-left 10s ease-in-out infinite; }
      .bars { animation: reset 10s linear infinite; }
      @keyframes swap-right {
        0%, 25% { transform: translate(0, 0); }
        55%, 92% { transform: translate(100px, 0); }
        93%, 100% { transform: translate(0, 0); }
      }
      @keyframes swap-left {
        0%, 25% { transform: translate(0, 0); }
        40% { transform: translate(-50px, -90px); }
        55%, 92% { transform: translate(-100px, 0); }
        93%, 100% { transform: translate(0, 0); }
      }
      @keyframes reset {
        0%, 82%, 100% { opacity: 1; }
        91%, 95% { opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) { .eight, .three, .bars { animation: none; } }
    </style>
  </defs>
  <rect x="1" y="1" width="1118" height="398" rx="20" fill="url(#background)" stroke="#30344F"/>
  <text class="mono" x="32" y="36" font-size="12" letter-spacing="2" fill="#67E8F9">SORTING VISUALIZER / ANGULAR</text>
  <text class="mono" x="1088" y="35" text-anchor="end" font-size="10" letter-spacing="1" fill="#AEB8CD">ILLUSTRATIVE LOOP / NOT A LIVE DEMO</text>
  <text x="32" y="79" font-size="30" font-weight="700" fill="#F1F5F9">Make the algorithm visible.</text>
  <rect x="32" y="108" width="520" height="220" rx="14" fill="#101B2B" stroke="#38566B"/>
  <path d="M74 280H510" stroke="#477189"/>
  <g class="bars">
    <rect x="100" y="248" width="60" height="32" rx="5" fill="#4B6585"/>
    <text class="mono" x="130" y="237" text-anchor="middle" font-size="20" fill="#D6E4ED">2</text>
    <g class="eight">
      <rect x="200" y="152" width="60" height="128" rx="5" fill="url(#cyan)"/>
      <text class="mono" x="230" y="141" text-anchor="middle" font-size="20" fill="#67E8F9">8</text>
    </g>
    <g class="three">
      <rect x="300" y="232" width="60" height="48" rx="5" fill="url(#violet)"/>
      <text class="mono" x="330" y="221" text-anchor="middle" font-size="20" fill="#C4B5FD">3</text>
    </g>
    <rect x="400" y="184" width="60" height="96" rx="5" fill="#4B6585"/>
    <text class="mono" x="430" y="173" text-anchor="middle" font-size="20" fill="#D6E4ED">6</text>
  </g>
  <text class="mono" x="292" y="309" text-anchor="middle" font-size="12" fill="#AEB8CD">ONE BUBBLE-SORT STEP / 8 &gt; 3 / SWAP</text>

  <text class="mono" x="600" y="134" font-size="11" letter-spacing="1.5" fill="#9EC5D6">BEFORE</text>
  <text class="mono" x="600" y="169" font-size="26" fill="#E7F7FC">[2, <tspan fill="#67E8F9">8</tspan>, <tspan fill="#C4B5FD">3</tspan>, 6]</text>
  <text class="mono" x="600" y="205" font-size="11" letter-spacing="1.5" fill="#C6B9DD">AFTER ONE SWAP</text>
  <text class="mono" x="600" y="240" font-size="26" fill="#E7F7FC">[2, <tspan fill="#C4B5FD">3</tspan>, <tspan fill="#67E8F9">8</tspan>, 6]</text>
  <text x="600" y="280" font-size="18" fill="#C4BED5">Control size, speed, and input distribution.</text>
  <text x="600" y="308" font-size="18" fill="#C4BED5">Watch comparisons, swaps, and writes.</text>
  <path d="M32 350H1088" stroke="#30344F"/>
  <text class="mono" x="32" y="380" font-size="12" fill="#67E8F9">6 ALGORITHMS</text>
  <text x="235" y="380" font-size="16" fill="#C4BED5">Bubble / Selection / Insertion / Merge / Quick / Heap</text>
</svg>
